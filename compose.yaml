services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: yourda
      POSTGRES_PASSWORD: local_dev_only
      POSTGRES_DB: yourda
    ports:
      - '127.0.0.1:5432:5432'
    healthcheck:
      test: ['CMD-SHELL','pg_isready -U yourda -d yourda']
      interval: 5s
      timeout: 5s
      retries: 10
    volumes: ['yourda_pg:/var/lib/postgresql/data']
  api:
    build: ./backend
    env_file: .env
    depends_on:
      db:
        condition: service_healthy
    ports:
      - '127.0.0.1:8000:8000'
volumes:
  yourda_pg:
